name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: | 
          9.0.x
          5.0.x
    - name: Generate package
      run: dotnet pack
    - name: Configure
      run: |
        dotnet nuget add source --username NiTiSon --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/NiTiSon/index.json"
        dotnet nuget add source --username NickName73 --password ${{ secrets.NUGET_TOKEN }} --store-password-in-clear-text  --name nuget "https://api.nuget.org/v3/index.json"
    - name: Github publish
      run: |
        dotnet nuget push outPackages/MutableString.0.1.0.nupkg --source github
    - name: NuGet publish
      run: |
        dotnet nuget push outPackages/MutableString.0.1.0.nupkg --source nuget
        dotnet nuget push outPackages/MutableString.0.1.0.snupkg --source nuget
