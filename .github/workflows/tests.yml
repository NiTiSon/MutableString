name: .NET Tests

on:
  push:
    branches: [ "stable" ]
    paths: [ "**.cs", "**.csproj" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: | 
          9.0.x
          6.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build "./src/MutableString" --no-restore
    - name: Test
      run: dotnet test "./tests/MutableString.Tests" --verbosity normal
